    model_type: "det"
    language: "multi"
    filename: "ch_PP-OCRv4_det_server_infer.onnx"
    url: "{paddle}/PP-OCRv4/chinese/ch_PP-OCRv4_det_server_infer.tar"
    size_mb: 110.0
    description: "PP-OCRv4 Server Detection (High Accuracy)"
    paddle_model_name: "ch_PP-OCRv4_det_server_infer"

  v4_rec_server:
    version: "v4"
    model_type: "rec"
    language: "ch"
    filename: "ch_PP-OCRv4_rec_server_infer.onnx"
    url: "{paddle}/PP-OCRv4/chinese/ch_PP-OCRv4_rec_server_infer.tar"
    size_mb: 88.0
    description: "PP-OCRv4 Server Recognition (High Accuracy)"
    paddle_model_name: "ch_PP-OCRv4_rec_server_infer"
    dict_url: "{github_dict_base}/ppocr_keys_v1.txt"
    dict_filename: "ch_dict_v4_server.txt"

  # ==================== Classification ====================
  v2_cls:
    version: "v2"
    model_type: "cls"
    language: "multi"
    filename: "ch_ppocr_mobile_v2.0_cls_infer.onnx"
    url: "{paddle}/dygraph_v2.0/ch/ch_ppocr_mobile_v2.0_cls_infer.tar"
    size_mb: 2.1
    description: "Text Direction Classification"
    paddle_model_name: "ch_ppocr_mobile_v2.0_cls_infer"

  # ==================== PP-OCRv5 ====================
  # Detection models
  v5_det_server:
    version: "v5"
    model_type: "det"
    language: "multi"
    filename: "PP-OCRv5_server_det_infer.onnx"
    url: "{paddlex}/PP-OCRv5_server_det_infer.tar"
    size_mb: 84.3
