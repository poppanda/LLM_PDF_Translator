      image_shape: "3, 80, 160"
    required_models: ["v5_det_mobile", "v5_rec_en", "v5_cls"]

  v5_multilingual:
    name: "PP-OCRv5 Multilingual"
    description: "Best for mixed language documents"
    det:
      model: "PP-OCRv5_mobile_det_infer.onnx"
      algorithm: "DB"
    rec:
      model: "PP-OCRv5_server_rec_infer.onnx"
      algorithm: "SVTR_LCNet"
      char_dict: "ppocr_keys_v5.txt"
    cls:
      enabled: true
      model: "PP-LCNet_x0_25_textline_ori_infer.onnx"
      image_shape: "3, 80, 160"
    required_models: ["v5_det_mobile", "v5_rec_server", "v5_cls"]

  v4_english:
    name: "PP-OCRv4 English"
    description: "v4 English OCR"
    det:
      model: "ch_PP-OCRv4_det_infer.onnx"
      algorithm: "DB"
