# OCR model presets for configuration
ocr_presets:
  v5_server:
    name: "PP-OCRv5 Server"
    description: "Highest accuracy, supports CN/EN/JP/Traditional CN"
    det:
      model: "PP-OCRv5_server_det_infer.onnx"
      algorithm: "DB"
    rec:
      model: "PP-OCRv5_server_rec_infer.onnx"
      algorithm: "SVTR_LCNet"
      char_dict: "ppocr_keys_v5.txt"
    cls:
      enabled: true
      model: "PP-LCNet_x0_25_textline_ori_infer.onnx"
      image_shape: "3, 80, 160"
    required_models: ["v5_det_server", "v5_rec_server", "v5_cls"]

  v5_mobile:
    name: "PP-OCRv5 Mobile"
    description: "Lightweight multi-language OCR"
    det:
      model: "PP-OCRv5_mobile_det_infer.onnx"
      algorithm: "DB"
    rec:
      model: "PP-OCRv5_mobile_rec_infer.onnx"
      algorithm: "SVTR_LCNet"
      char_dict: "ppocr_keys_v5_mobile.txt"
    cls:
      enabled: true
      model: "PP-LCNet_x0_25_textline_ori_infer.onnx"
      image_shape: "3, 80, 160"
    required_models: ["v5_det_mobile", "v5_rec_mobile", "v5_cls"]

  v5_english:
    name: "PP-OCRv5 English"
    description: "Optimized for English text"
    det:
      model: "PP-OCRv5_mobile_det_infer.onnx"
      algorithm: "DB"
    rec:
      model: "en_PP-OCRv5_mobile_rec_infer.onnx"
      algorithm: "SVTR_LCNet"
