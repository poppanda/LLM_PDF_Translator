# Model sets for easy selection
model_sets:
  # PP-OCRv5 (Latest - Recommended)
  v5_server:
    models: ["v5_det_server", "v5_rec_server", "v5_cls"]
  v5_mobile:
    models: ["v5_det_mobile", "v5_rec_mobile", "v5_cls"]
  v5_english:
    models: ["v5_det_mobile", "v5_rec_en", "v5_cls"]
  v5_multilingual:
    models: ["v5_det_mobile", "v5_rec_server", "v5_cls"]
  # PP-OCRv4
  v4_english:
    models: ["v4_det", "v4_rec_en"]
  v4_chinese:
    models: ["v4_det", "v4_rec_ch"]
  v4_server:
    models: ["v4_det_server", "v4_rec_server"]
  # PP-OCRv3
  v3_english:
    models: ["v3_det_en", "v3_rec_en", "v2_cls"]
  v3_chinese:
    models: ["v3_det_ch", "v3_rec_ch", "v2_cls"]

