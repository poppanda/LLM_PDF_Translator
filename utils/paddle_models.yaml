# PaddleOCR Model Configuration
# All models are downloaded from official PaddleOCR repository and converted locally.
# Source: https://paddleocr.bj.bcebos.com/

# Base URLs for model downloads
base_urls:
  paddle: "https://paddleocr.bj.bcebos.com"
  paddlex: "https://paddle-model-ecology.bj.bcebos.com/paddlex/official_inference_model/paddle3.0.0"
  github_raw: "https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR"
  github_dict_base: "https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/release/2.7/ppocr/utils"
  github_dict_dir: "https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/release/2.7/ppocr/utils/dict"
  github_dict_main: "https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/main/ppocr/utils/dict"

# Model definitions
models:
  # ==================== PP-OCRv3 ====================
  v3_det_en:
    version: "v3"
    model_type: "det"
    language: "en"
    filename: "en_PP-OCRv3_det_infer.onnx"
    url: "{paddle}/PP-OCRv3/english/en_PP-OCRv3_det_infer.tar"
    size_mb: 3.8
    description: "PP-OCRv3 English Detection"
    paddle_model_name: "en_PP-OCRv3_det_infer"

  v3_rec_en:
    version: "v3"
    model_type: "rec"
    language: "en"
    filename: "en_PP-OCRv3_rec_infer.onnx"
    url: "{paddle}/PP-OCRv3/english/en_PP-OCRv3_rec_infer.tar"
    size_mb: 9.5
    description: "PP-OCRv3 English Recognition"
    paddle_model_name: "en_PP-OCRv3_rec_infer"
    dict_url: "{github_dict_base}/en_dict.txt"
    dict_filename: "en_dict.txt"

  v3_det_ch:
    version: "v3"
    model_type: "det"
    language: "ch"
    filename: "ch_PP-OCRv3_det_infer.onnx"
    url: "{paddle}/PP-OCRv3/chinese/ch_PP-OCRv3_det_infer.tar"
    size_mb: 3.8
    description: "PP-OCRv3 Chinese Detection"
    paddle_model_name: "ch_PP-OCRv3_det_infer"

  v3_rec_ch:
    version: "v3"
    model_type: "rec"
    language: "ch"
    filename: "ch_PP-OCRv3_rec_infer.onnx"
    url: "{paddle}/PP-OCRv3/chinese/ch_PP-OCRv3_rec_infer.tar"
    size_mb: 12.4
    description: "PP-OCRv3 Chinese Recognition"
    paddle_model_name: "ch_PP-OCRv3_rec_infer"
    dict_url: "{github_dict_base}/ppocr_keys_v1.txt"
    dict_filename: "ch_dict.txt"

  v3_rec_ja:
    version: "v3"
    model_type: "rec"
    language: "ja"
    filename: "japan_PP-OCRv3_rec_infer.onnx"
    url: "{paddle}/PP-OCRv3/multilingual/japan_PP-OCRv3_rec_infer.tar"
    size_mb: 11.0
    description: "PP-OCRv3 Japanese Recognition"
    paddle_model_name: "japan_PP-OCRv3_rec_infer"
    dict_url: "{github_dict_dir}/japan_dict.txt"
    dict_filename: "japan_dict.txt"

  v3_rec_ko:
    version: "v3"
    model_type: "rec"
    language: "ko"
    filename: "korean_PP-OCRv3_rec_infer.onnx"
    url: "{paddle}/PP-OCRv3/multilingual/korean_PP-OCRv3_rec_infer.tar"
    size_mb: 11.0
    description: "PP-OCRv3 Korean Recognition"
    paddle_model_name: "korean_PP-OCRv3_rec_infer"
    dict_url: "{github_dict_dir}/korean_dict.txt"
    dict_filename: "korean_dict.txt"

  v3_rec_ar:
    version: "v3"
    model_type: "rec"
    language: "ar"
    filename: "arabic_PP-OCRv3_rec_infer.onnx"
    url: "{paddle}/PP-OCRv3/multilingual/arabic_PP-OCRv3_rec_infer.tar"
    size_mb: 11.0
    description: "PP-OCRv3 Arabic Recognition"
    paddle_model_name: "arabic_PP-OCRv3_rec_infer"
    dict_url: "{github_dict_dir}/arabic_dict.txt"
    dict_filename: "arabic_dict.txt"

  # ==================== PP-OCRv4 ====================
  v4_det:
    version: "v4"
    model_type: "det"
    language: "multi"
    filename: "ch_PP-OCRv4_det_infer.onnx"
    url: "{paddle}/PP-OCRv4/chinese/ch_PP-OCRv4_det_infer.tar"
    size_mb: 4.7
    description: "PP-OCRv4 Detection (Multi-language)"
    paddle_model_name: "ch_PP-OCRv4_det_infer"

  v4_rec_en:
