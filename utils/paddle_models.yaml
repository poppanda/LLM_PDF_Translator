  v4_english:
    name: "PP-OCRv4 English"
    description: "v4 English OCR"
    models_desc: "det + rec"
    order: 5
  v4_chinese:
    name: "PP-OCRv4 Chinese"
    description: "v4 Chinese OCR"
    models_desc: "det + rec"
    order: 6
  v4_server:
    name: "PP-OCRv4 Server"
    description: "High accuracy v4 models"
    models_desc: "det + rec"
    badge: "High Accuracy"
    badge_type: "accuracy"
    order: 7
  v3_english:
    name: "PP-OCRv3 English"
